<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 智慧英文單字卡學習 APP</title>
  <meta name="description" content="拍照即析、智能發音、音節標記！利用 Gemini 2.5 Flash 即時分析課本英文單字與中文解釋的精品學習工具。">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Premium Header Area -->
    <header>
      <h1 id="app-title">Gemini EngCard</h1>
      <p id="app-subtitle">拍攝課本單字 ➔ 智慧分析 ➔ 完美複習與發音</p>
      
      <!-- API settings trigger button -->
      <button id="btn-trigger-settings" class="settings-trigger" aria-label="設定 Gemini API 金鑰">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Gemini API 金鑰設定</span>
      </button>
    </header>

    <!-- Slide Down Settings Panel -->
    <section id="panel-settings" class="settings-panel" aria-label="Gemini API 金鑰設定面板">
      <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        設定您的 Gemini API Key
      </h3>
      <p style="font-size: 0.9rem; color: var(--text-grey); margin-bottom: 0.5rem;">
        此金鑰會儲存於您的本機瀏覽器中，僅用於直接呼叫 Google 官方 API，絕不上傳至任何第三方伺服器。
      </p>
      <div class="input-group">
        <input type="password" id="input-api-key" class="api-input" placeholder="請輸入 AIzaSy... 開頭的金鑰" aria-label="Gemini API 金鑰">
        <button id="btn-save-api" class="btn" aria-label="儲存金鑰">儲存</button>
        <button id="btn-clear-api" class="btn btn-secondary" aria-label="清除金鑰">清除</button>
      </div>
    </section>

    <!-- Main Controller / Upload Section -->
    <section id="section-photo-upload" class="upload-container" aria-label="上傳或拍攝課本照片">
      <div class="upload-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 0.2rem;">
        <h2 style="font-size: 1.25rem; font-weight: 500;">開始分析新的英文課本頁面</h2>
        <p style="font-size: 0.9rem; color: var(--text-grey);">使用您的手機、iPad 拍照或上傳檔案，讓 AI 為您精準辨識與排版</p>
      </div>

      <div class="upload-buttons">
        <!-- Optimized for mobile devices: capture="environment" tells the browser to launch rear camera directly -->
        <label for="input-camera" class="btn" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          拍照分析
        </label>
        <input type="file" id="input-camera" class="file-input" accept="image/*" capture="environment">

        <label for="input-file" class="btn btn-secondary" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          選擇相簿照片
        </label>
        <input type="file" id="input-file" class="file-input" accept="image/*">
      </div>

      <!-- Preview of uploaded/captured image -->
      <div id="container-preview" class="preview-container">
        <span style="font-size: 0.85rem; color: var(--text-grey);">已載入圖片預覽：</span>
        <img id="img-captured-preview" class="preview-image" src="" alt="拍攝/上傳之課本預覽">
        <button id="btn-start-analyze" class="btn" style="width: 100%;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          確認送出 AI 分析
        </button>
      </div>

      <!-- Loading overlay inside container -->
      <div id="loader-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loader-text" class="loading-text">Gemini AI 分析中，請稍候...</div>
      </div>
    </section>

    <!-- Toggle Controls (Syllables & TTS Speed) - Matches Image 2 -->
    <section class="control-bar-wrapper" aria-label="單字卡顯示與播放控制列">
      <div class="control-bar">
        
        <!-- Syllables Button (Teal Background in mockup) -->
        <button id="btn-toggle-syllable" class="toggle-syllable-btn" aria-label="切換顯示音節">
          <!-- Text Icon matching Image 2 "Tт 音節" -->
          <span style="font-weight: 700; font-family: var(--font-en); font-size: 1.1rem; line-height: 1;">Tт</span>
          <span>音節</span>
        </button>

        <!-- Speed Adjustment Button (cycles 1x -> 0.8x -> 0.6x -> 1.2x -> 1x) -->
        <button id="btn-adjust-speed" class="speed-adjuster-btn" aria-label="調整播放語速">
          <!-- Speedometer/gauge icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span id="speed-label">1x</span>
        </button>

        <!-- English Only Toggle Button -->
        <button id="btn-toggle-english-only" class="speed-adjuster-btn" aria-label="切換只顯示英文">
          <!-- Eye Off Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <span>只顯示英文</span>
        </button>

        <!-- Chinese Only Toggle Button -->
        <button id="btn-toggle-chinese-only" class="speed-adjuster-btn" aria-label="切換只顯示中文">
          <!-- Eye Icon (modified) or similar quiz icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <span>只顯示中文</span>
        </button>

      </div>
    </section>

    <!-- Deck Selection Tabs -->
    <section class="deck-selector" aria-label="選擇字卡庫">
      <div class="deck-tabs">
        <button id="tab-sample" class="deck-tab active" data-deck="sample" aria-label="載入範例字卡">
          課本精選範例 (41 字)
        </button>
        <button id="tab-custom" class="deck-tab" data-deck="custom" aria-label="載入我拍攝的單字">
          我分析的單字
        </button>
      </div>
      <div id="text-deck-stats" class="deck-stats">
        共 41 個單字
      </div>
    </section>

    <!-- Vocabulary Grid - Renders Cards Dynamic -->
    <main>
      <section id="grid-vocabulary" class="vocabulary-grid" aria-label="單字卡展示區">
        <!-- Rendered by JavaScript dynamically -->
      </section>
    </main>

  </div>

  <!-- Toast Notification -->
  <div id="toast-notify" class="toast" role="alert" aria-live="assertive">
    <span id="toast-message">提示訊息</span>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Gemini EngCard Learning Tool. Powered by Google Gemini 2.5 Flash.</p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
